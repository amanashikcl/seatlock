# RabbitMQ 4 refuses two features Celery's worker still uses, so permit them explicitly:
#  - transient non-exclusive queues (remote-control/gossip reply queues)
#  - global QoS (how the worker limits prefetching)
# Known tech debt: RabbitMQ will remove it in a future major version (we stay on 4.x).
# Exit plan: quorum queues + disable Celery remote control (see docs/decisions.md #10).
deprecated_features.permit.transient_nonexcl_queues = true
deprecated_features.permit.global_qos = true
