[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seatlock"
version = "0.1.0"
description = "Flash-sale ticketing backend that stays correct under contention."
requires-python = ">=3.12"
dependencies = [
    "celery>=5.4",
    "django>=6.1,<6.2",
    "django-environ>=0.12",
    "gunicorn>=23.0",
    "djangorestframework>=3.16",
    "djangorestframework-simplejwt>=5.5",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by Django; do not lint or reformat them.
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake test passwords are fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "environ.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["rest_framework.*", "rest_framework_simplejwt.*", "celery.*"]
ignore_missing_imports = true

# DRF ships no type info, so its classes are Any. Allow subclassing them only where we do.
[[tool.mypy.overrides]]
module = [
    "apps.accounts.serializers",
    "apps.accounts.views",
    "apps.accounts.permissions",
    "apps.events.serializers",
    "apps.events.views",
    "apps.events.permissions",
]
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
addopts = "--strict-markers -ra"
testpaths = ["tests"]

# Celery's @shared_task is untyped, so decorated task functions look untyped to mypy.
[[tool.mypy.overrides]]
module = ["apps.reservations.tasks"]
disallow_untyped_decorators = false
