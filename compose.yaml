# Settings shared by everything that runs our Django code: api, worker, beat.
x-app: &app
  build: .
  restart: unless-stopped
  environment:
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    # `api` is the name other containers (Prometheus, the load generator) use to reach us.
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},api
    SECURE_SSL_REDIRECT: "False"
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?set in .env}
    # Normal defaults; the load test overrides them (see docs/benchmarks.md).
    HOLD_RATE_LIMIT: ${HOLD_RATE_LIMIT:-10}
    SEAT_GATE_ENABLED: ${SEAT_GATE_ENABLED:-true}
    CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER:?set in .env}:${RABBITMQ_DEFAULT_PASS:?set in .env}@rabbitmq:5672//
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Takes jobs off the RabbitMQ queue and runs them.
  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]

  # The scheduler: puts a message on the queue on a timer. Run exactly ONE of these.
  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]

  # Load generator (Locust). Only starts when asked for: docker compose --profile loadtest run ...
  locust:
    profiles: ["loadtest"]
    image: locustio/locust:2.32.0
    volumes:
      - ./loadtest:/mnt/locust
    environment:
      EVENT_ID: ${EVENT_ID:-}
      HOT_SEATS: ${HOT_SEATS:-50}
    command: >
      -f /mnt/locust/locustfile.py --headless
      -u ${LOAD_USERS:-300} -r ${LOAD_RATE:-20} -t ${LOAD_DURATION:-90s}
      --host http://api:8000 --csv /mnt/locust/results/run
    depends_on:
      api:
        condition: service_healthy

  # Metrics storage + dashboards. Only start when asked for:
  #   docker compose --profile observability up -d
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      # Local demo only (port is bound to 127.0.0.1): anyone on this machine can view.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/seatlock.conf:/etc/rabbitmq/conf.d/20-seatlock.conf:ro
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
